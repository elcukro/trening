<h2>Kod logowania do aplikacji Trening</h2>
<p style="font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
<p>Wpisz go w aplikacji: Więcej → Ustawienia → Konto. Kod jest ważny przez godzinę i działa tylko raz.</p>
<p style="color:#64748b;font-size:12px">Jeśli wolisz, możesz też otworzyć <a href="{{ .ConfirmationURL }}">link logowania</a> – ale tylko w tej samej przeglądarce, z której wysłano prośbę.</p>
